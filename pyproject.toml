[project]
name = "oremi-device"
version = "1.0.0b11"
description = "Audio capture device for Oremi smart home ecosystem with wake word detection, speech transcription, and MQTT integration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sébastien Demanou", email = "demsking@gmail.com" }
]
keywords = ["oremi", "device", "ohunerin", "listener", "sound", "detection", "wakeword", "mqtt"]

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "websockets>=14.1,<15.0",
  "sounddevice>=0.5.1,<0.6.0",
  "paho-mqtt>=2.1.0,<3.0.0",
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
  "pydantic-settings>=2.14.2",
  "timezonefinder>=8.2.4",
  "geopy>=2.4.1",
  "pydantic-ai>=2.6.0",
  "ollama>=0.6.2",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Source" = "https://gitlab.com/demsking/oremi-device"
"Tracker" = "https://gitlab.com/demsking/oremi-device/-/issues"
"Documentation" = "https://gitlab.com/demsking/oremi-device/-/blob/main/README.md"

[project.scripts]
oremi-device = "device.__main__:main"

[dependency-groups]
dev = [
  "aiohttp>=3.9.0",
  "autopep8>=2.3.2",
  "bandit>=1.8.3",
  "classify-imports>=4.2.0",
  "graphifyy>=0.8.46",
  "pylint>=3.3.7",
  "pyroma>=4.2",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "python-dotenv>=1.1.0",
  "python-slugify>=8.0.4",
  "reorder-python-imports>=3.14.0",
  "sounddevice>=0.5.5",
  "twine>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["device"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "I001"]
