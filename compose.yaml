---
name: dev-oremi-device

services:
  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:0.22.0
    ports:
      - '6574:6274'
    environment:
      HOST: 0.0.0.0
      MCP_AUTO_OPEN_ENABLED: false
      DANGEROUSLY_OMIT_AUTH: true

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: unless-stopped
    ports:
      - 41883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ollama:
    tty: true
    image: ollama/ollama
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - 41434:11434
    environment:
      CUDA_VISIBLE_DEVICES: 0

  akorin:
    image: demsking/oremi-akorin
    depends_on:
      - isinmi
      - ojo
      - mosquitto
      - rediyo
      - kansa
      - ollama
    environment:
      OREMI_AKORIN_OLLAMA_BASE_URL: http://ollama:11434
      OREMI_AKORIN_ISINMI_URL: http://isinmi:7337
      OREMI_AKORIN_OJO_URL: http://ojo:5040
      OREMI_AKORIN_REDIYO_URL: http://rediyo:5076
      OREMI_AKORIN_KANSA_URL: http://kansa:5046
      OREMI_AKORIN_MQTT_BROKER: mosquitto
    ports:
      - 45020:5020

  ohunerin:
    image: demsking/oremi-ohunerin
    ports:
      - 45023:5023

  andika:
    image: demsking/oremi-andika
    ports:
      - 45315:5315
    volumes:
      - ~/.cache/vosk/models:/usr/share/vosk

  isinmi:
    image: demsking/oremi-isinmi
    restart: unless-stopped
    ports:
      - 45073:5073
    environment:
      OREMI_ISINMI_DATABASE_ENCRYPTION_KEY: B0JJTY+h9x1u36hFuD0UqakgN0P//DWk+r+3+nY3JFo=
    volumes:
      - ~/.config/oremi-isinmi-agent:/oremi/data

  ojo:
    image: demsking/oremi-ojo
    restart: unless-stopped
    ports:
      - 45040:5040

  rediyo:
    image: demsking/oremi-rediyo
    restart: unless-stopped
    ports:
      - 45076:5076

  kansa:
    image: demsking/oremi-kansa
    restart: unless-stopped
    ports:
      - 45046:5046
    volumes:
      - ~/.config/oremi-kansa-agent:/oremi/data

  whisper-model:
    image: ghcr.io/ggml-org/whisper.cpp:main
    volumes:
      - whisper-models:/models
    command:
      - ./models/download-ggml-model.sh base /models

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    depends_on:
      - whisper-model
    ports:
      - '48080:8080'
    volumes:
      - whisper-models:/models:ro
    command:
      - whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-base.bin

  edge-tts:
    image: travisvn/openai-edge-tts:latest
    restart: unless-stopped
    ports:
      - '45050:5050'
    environment:
      API_KEY: your_api_key_here
      PORT: 5050

volumes:
  whisper-models:
...
