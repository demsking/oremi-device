---
name: dev-oremi-device

services:
  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:0.22.0
    ports:
      - '6574:6274'
    environment:
      HOST: 0.0.0.0
      MCP_AUTO_OPEN_ENABLED: false
      DANGEROUSLY_OMIT_AUTH: true
    profiles:
      - dev

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: unless-stopped
    ports:
      - 41883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    profiles:
      - dev

  ollama:
    tty: true
    image: ollama/ollama:0.35.0
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - 41434:11434
    environment:
      CUDA_VISIBLE_DEVICES: 0
    profiles:
      - dev

  akorin:
    image: demsking/oremi-akorin
    depends_on:
      - isinmi
      - ojo
      - izwi
      # - mosquitto
      - rediyo
      - kansa
      # - ollama
    environment:
      OREMI_AKORIN_OLLAMA_BASE_URL: ${OREMI_AKORIN_OLLAMA_BASE_URL:-http://ollama:11434}
      OREMI_AKORIN_ISINMI_URL: http://isinmi:5073/mcp
      OREMI_AKORIN_OJO_URL: http://ojo:5040/mcp
      OREMI_AKORIN_REDIYO_URL: http://rediyo:5076/mcp
      OREMI_AKORIN_KANSA_URL: http://kansa:5046/mcp
      OREMI_AKORIN_MQTT_BROKER: ${OREMI_AKORIN_MQTT_BROKER:-mosquitto}
      OREMI_AKORIN_MQTT_PORT: ${OREMI_AKORIN_MQTT_PORT:-1883}
    ports:
      - 45020:5020

  izwi:
    image: demsking/oremi-izwi
    ports:
      - 45031:5031
    environment:
      OREMI_IZWI_TTS_DEFAULT_SPEED: 1.25
    volumes:
      - ~/.cache/oremi-izwi:/oremi/data

  ohunerin:
    image: demsking/oremi-ohunerin
    ports:
      - 45023:5023
    volumes:
      - ./config/ohunerin.json:/oremi/data/config.json

  andika:
    image: demsking/oremi-andika
    ports:
      - 45022:5022
    environment:
      OREMI_ANDIKA_MODEL_NAME: zhifeixie/Mega-ASR
      OREMI_ANDIKA_ENABLE_GPU: true
      OREMI_ANDIKA_USE_VLLM: true
      OREMI_ANDIKA_VLLM_GPU_MEMORY_UTILIZATION: 0.8
      OREMI_ANDIKA_VLLM_MAX_NEW_TOKENS: 64
      OREMI_ANDIKA_AUDIO_ROUTING: true
      OREMI_ANDIKA_QUALITY_THRESHOLD: 0.5
    volumes:
      - ~/.local/share/oremi-andika:/oremi/data
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16gb
        reservations:
          cpus: '2.0'
          memory: 8gb
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  isinmi:
    image: demsking/oremi-isinmi
    restart: unless-stopped
    ports:
      - 45073:5073
    environment:
      OREMI_ISINMI_DATABASE_ENCRYPTION_KEY: B0JJTY+h9x1u36hFuD0UqakgN0P//DWk+r+3+nY3JFo=
    volumes:
      - ~/.local/share/oremi-isinmi:/oremi/data

  ojo:
    image: demsking/oremi-ojo
    restart: unless-stopped
    ports:
      - 45040:5040

  rediyo:
    image: demsking/oremi-rediyo
    restart: unless-stopped
    ports:
      - 45076:5076

  kansa:
    image: demsking/oremi-kansa
    restart: unless-stopped
    ports:
      - 45046:5046
    volumes:
      - ~/.local/share/oremi-kansa:/oremi/data
...
