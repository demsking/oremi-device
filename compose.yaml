---
name: dev-oremi-device

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: always
    ports:
      - 31883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ollama:
    tty: true
    image: ollama/ollama
    restart: always
    runtime: nvidia
    volumes:
      - ~/.ollama:/root/.ollama
    ports:
      - 31434:11434
    environment:
      CUDA_VISIBLE_DEVICES: 0

  akorin:
    image: demsking/oremi-akorin
    depends_on:
      - isinmi
      - weather
      - mosquitto
      - rediyo
      - kansa
      - ollama
    environment:
      OREMI_AKORIN_OLLAMA_BASE_URL: http://ollama:11434
      OREMI_AKORIN_ISINMI_URL: http://isinmi:7337
      OREMI_AKORIN_WEATHER_URL: http://weather:1777
      OREMI_AKORIN_REDIYO_URL: http://rediyo:9170
      OREMI_AKORIN_KANSA_URL: http://kansa:4940
      OREMI_AKORIN_MQTT_BROKER: mosquitto
    ports:
      - 45020:5020

  ohunerin:
    image: demsking/oremi-ohunerin
    ports:
      - 45023:5023

  andika:
    image: demsking/oremi-andika
    ports:
      - 45315:5315
    volumes:
      - ~/.cache/vosk/models:/usr/share/vosk

  isinmi:
    image: demsking/oremi-isinmi-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 37337:7337
    environment:
      OREMI_ISINMI_OLLAMA_BASE_URL: http://ollama:11434
      OREMI_ISINMI_DATABASE_ENCRYPTION_KEY: B0JJTY+h9x1u36hFuD0UqakgN0P//DWk+r+3+nY3JFo=
    volumes:
      - ~/.config/oremi-isinmi-agent:/oremi/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7337/health/']
      interval: 30s
      timeout: 10s
      retries: 3

  weather:
    image: demsking/oremi-weather-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 31777:1777
    environment:
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b

  rediyo:
    image: demsking/oremi-rediyo-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 39170:9170
    volumes:
      - ~/.config/oremi-rediyo-agent:/var/cache/oremi-rediyo-agent
    environment:
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b

  kansa:
    image: demsking/oremi-kansa-agent
    restart: always
    depends_on:
      - ollama
    ports:
      - 34940:4940
    volumes:
      - ~/.config/oremi-kansa-agent:/var/cache/oremi-kansa-agent
    environment:
      OLLAMA_BASEURL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b

  whisper-model:
    image: ghcr.io/ggml-org/whisper.cpp:main
    volumes:
      - whisper-models:/models
    command:
      - ./models/download-ggml-model.sh base /models

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    restart: unless-stopped
    depends_on:
      - whisper-model
    ports:
      - '48080:8080'
    volumes:
      - whisper-models:/models:ro
    command:
      - whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-base.bin

  edge-tts:
    image: travisvn/openai-edge-tts:latest
    restart: unless-stopped
    ports:
      - '45050:5050'
    environment:
      API_KEY: your_api_key_here
      PORT: 5050

volumes:
  whisper-models:
...
